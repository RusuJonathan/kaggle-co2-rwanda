lgbm:
  num_leaves:
    distribution: IntUniformDistribution
    low: 20
    high: 300
  max_depth:
    distribution: IntUniformDistribution
    low: 3
    high: 12
  learning_rate:
    distribution: LogUniformDistribution
    low: 0.005
    high: 0.2
  n_estimators:
    distribution: IntUniformDistribution
    low: 200
    high: 2000
  subsample:
    distribution: UniformDistribution
    low: 0.4
    high: 1.0
  colsample_bytree:
    distribution: UniformDistribution
    low: 0.4
    high: 1.0
  reg_lambda:
    distribution: LogUniformDistribution
    low: 0.1
    high: 10.0
  reg_alpha:
    distribution: LogUniformDistribution
    low: 0.01
    high: 5.0
  min_child_weight:
    distribution: LogUniformDistribution
    low: 1
    high: 50
  min_child_samples:
    distribution: IntUniformDistribution
    low: 5
    high: 100

xgboost:
  n_estimators:
    distribution: IntUniformDistribution
    low: 200
    high: 2000
  max_depth:
    distribution: IntUniformDistribution
    low: 3
    high: 10
  learning_rate:
    distribution: LogUniformDistribution
    low: 0.005
    high: 0.2
  subsample:
    distribution: UniformDistribution
    low: 0.4
    high: 1.0
  colsample_bytree:
    distribution: UniformDistribution
    low: 0.4
    high: 1.0
  gamma:
    distribution: LogUniformDistribution
    low: 0.001
    high: 5.0
  reg_alpha:
    distribution: LogUniformDistribution
    low: 0.001
    high: 5.0
  reg_lambda:
    distribution: LogUniformDistribution
    low: 0.1
    high: 10.0
  min_child_weight:
    distribution: IntUniformDistribution
    low: 1
    high: 20

catboost:
  iterations:
    distribution: IntUniformDistribution
    low: 100
    high: 2000
  depth:
    distribution: IntUniformDistribution
    low: 4
    high: 10
  learning_rate:
    distribution: LogUniformDistribution
    low: 0.005
    high: 0.2
  colsample_bylevel:
    distribution: UniformDistribution
    low: 0.4
    high: 1.0
  l2_leaf_reg:
    distribution: LogUniformDistribution
    low: 0.5
    high: 20.0
  random_strength:
    distribution: UniformDistribution
    low: 0.1
    high: 5.0
  bagging_temperature:
    distribution: UniformDistribution
    low: 0.0
    high: 1.0

random_forest:
  n_estimators:
    distribution: IntUniformDistribution
    low: 100
    high: 1500
  max_depth:
    distribution: IntUniformDistribution
    low: 5
    high: 20
  min_samples_split:
    distribution: IntUniformDistribution
    low: 2
    high: 20
  min_samples_leaf:
    distribution: IntUniformDistribution
    low: 1
    high: 20
  max_samples:
    distribution: UniformDistribution
    low: 0.5
    high: 1.0
  max_features:
    distribution: CategoricalDistribution
    categories: ['sqrt', 'log2', 0.3, 0.5, 0.7]

elasticnet:
  alpha:
    distribution: LogUniformDistribution
    low: 0.0001
    high: 10.0
  l1_ratio:
    distribution: UniformDistribution
    low: 0.05
    high: 0.95

svr:
  C:
    distribution: LogUniformDistribution
    low: 0.01
    high: 1000
  epsilon:
    distribution: LogUniformDistribution
    low: 0.0001
    high: 1.0
  gamma:
    distribution: LogUniformDistribution
    low: 0.00001
    high: 1.0
